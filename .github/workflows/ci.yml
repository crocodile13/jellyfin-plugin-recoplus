name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Version consistency (meta.json, csproj, manifest.json)
        run: |
          META=$(jq -r .version meta.json)
          CSPROJ=$(grep -oP '<Version>\K[^<]+' src/Jellyfin.Plugin.RecoPlus/Jellyfin.Plugin.RecoPlus.csproj)
          TOP=$(jq -r '.[0].versions[0].version // empty' manifest.json)
          echo "meta=$META csproj=$CSPROJ manifest(top)=$TOP"
          test "$META" = "$CSPROJ"
          # 1.MINOR.PATCH.0 and a changelog starting with "1.MINOR.PATCH" (meta.json: the release workflow copies it into
          # the catalogue). The catalogue only lists published versions: the release workflow adds the new entry once the
          # zip exists (an entry without URL breaks installs: 1.0.36 was one; a release PR listing the version made it
          # appear a few minutes before it could be installed). So the top entry is the version in progress (already
          # published) or the previous one (release pending), never a newer one.
          echo "$META" | grep -qE '^1\.[0-9]+\.[0-9]+\.0$'
          jq -e --arg p "${META%.0}" '.changelog | startswith($p)' meta.json > /dev/null
          python3 - "$META" <<'PY'
          import json, sys
          meta = sys.argv[1]
          v = json.load(open("manifest.json"))[0]["versions"]
          key = lambda x: tuple(int(p) for p in x.split("."))
          assert all(key(a["version"]) > key(b["version"]) for a, b in zip(v, v[1:])), "versions not strictly decreasing"
          bad = [e["version"] for e in v if not (e["sourceUrl"] and e["checksum"] and e["timestamp"])]
          assert not bad, f"unpublished entries in the catalogue: {bad}"
          assert not v or key(v[0]["version"]) <= key(meta), f"catalogue lists {v[0]['version']}, newer than meta.json {meta}"
          PY

      - name: Jellyfin compatibility window (compat.json, every place that repeats it)
        run: python tools/compat.py check

      - name: Regenerate reference data from the Python prototype
        # The C# engine must reproduce the prototype exactly: regenerate the synthetic reference
        # on this machine, then the C# parity tests below compare against it.
        run: cd prototype && python golden.py ../tests/RecoPlus.Tests/golden.json

      - name: Build, test and package
        run: ./build.sh

      - name: Build against the latest Jellyfin 12 packages
        # The plugin targets the oldest supported version (targetAbi); this catches APIs removed or
        # changed since then (obsolete members fail the build: warnings are errors).
        run: |
          V=$(curl -fsS https://api.nuget.org/v3-flatcontainer/jellyfin.controller/index.json | jq -r '.versions[]' | grep -E '^12\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Jellyfin.Controller $V"
          test -n "$V"
          dotnet build src/Jellyfin.Plugin.RecoPlus -c Release -nologo -p:JellyfinVersion=$V -o "$RUNNER_TEMP/latest"

      - name: Web client tests (jsdom)
        run: cd tests/client && npm install --no-save --no-package-lock --silent jsdom@24.1.3 && node client.test.mjs && node configpage.test.mjs && node userpage.test.mjs

      - name: reco-export tests
        run: cd tools/reco-export && python -W error::ResourceWarning test_reco_export.py

      - uses: actions/upload-artifact@v7
        with:
          name: RecoPlus-build
          path: out/
          retention-days: 14
