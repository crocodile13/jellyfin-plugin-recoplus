name: Integration

# Reco+ in a real Jellyfin (Docker), with and without the plugins it works with, on the oldest and newest supported
# versions: synthetic library (real titles, dummy files, TMDb metadata through Jellyfin), simulated accounts, full
# computation, then every hook and what each account is offered (report in the job summary and as an artifact).
# eco: everything plus a real Seerr linked to Jellyfin (requests, watchlists, extended mode, current lists).
# Nothing secret: random passwords per run, tokens and API keys masked, fictitious accounts only.
# Runs on pull requests that touch the plugin or this test, every Monday (new Jellyfin, plugin and Seerr versions are
# picked up automatically: latest releases and images), and by hand.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/integration/**'
      - '.github/workflows/integration.yml'
  push:
    branches: ['sim-*']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jellyfin:
    name: Jellyfin ${{ matrix.jellyfin }} — ${{ matrix.plugins }}
    runs-on: ubuntu-latest
    timeout-minutes: 75   # bench : la première analyse en ligne d'une bibliothèque de ~400 titres
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.2', '12.4']
        plugins: ['reco', 'hss', 'full', 'eco', 'bench']
        # bench (banc réaliste : ~400 titres, 30 comptes, mesure objective) : dernière version, lundi, à la main, branches sim-* ;
        # pull requests : pas de banc, et l'écosystème (Seerr) sur la dernière version seulement
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"jellyfin":"12.2","plugins":"eco"},{"jellyfin":"12.2","plugins":"bench"},{"jellyfin":"12.4","plugins":"bench"}]' || '[{"jellyfin":"12.2","plugins":"bench"}]') }}
    env:
      SIM_OUT: ${{ github.workspace }}/sim-out
      SIM_MEDIA: ${{ github.workspace }}/media
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build Reco+
        run: SKIP_TESTS=1 ./build.sh   # unit tests run in CI

      - name: Plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          P=jf/config/plugins
          mkdir -p "$P" jf/cache media
          cp -r out/RecoPlus_* "$P/"
          JV="${{ matrix.jellyfin }}.0"
          get() {   # dépôt, motif du fichier, dossier
            mkdir -p "$P/$3" dl
            gh release download -R "$1" -p "$2" -D dl --clobber
            unzip -q -o "dl/$2" -d "$P/$3"
          }
          if [ "${{ matrix.plugins }}" != reco ]; then
            get IAmParadox27/jellyfin-plugin-file-transformation "Release-$JV.zip" FileTransformation
            get IAmParadox27/jellyfin-plugin-pages "Release-$JV.zip" PluginPages
            get IAmParadox27/jellyfin-plugin-home-sections "Release-$JV.zip" HomeScreenSections
          fi
          if [ "${{ matrix.plugins }}" = full ] || [ "${{ matrix.plugins }}" = eco ] || [ "${{ matrix.plugins }}" = bench ]; then
            get n00bcodr/Jellyfin-Enhanced "Jellyfin.Plugin.JellyfinEnhanced_12.0.0.zip" JellyfinEnhanced
            V=$(gh release view -R jellyfin/jellyfin-plugin-playbackreporting --json assets -q '.assets[].name' | grep -E '^playback-reporting_.*\.zip$' | head -1)
            get jellyfin/jellyfin-plugin-playbackreporting "$V" PlaybackReporting
          fi
          if [ "${{ matrix.plugins }}" = full ] || [ "${{ matrix.plugins }}" = eco ]; then
            get IAmParadox27/jellyfin-plugin-media-bar "Release-$JV.zip" MediaBar   # ticket #50 : la configuration du rapporteur
          fi
          ls "$P"

      - name: Library
        env:
          SIM_BENCH: ${{ matrix.plugins == 'bench' && '1' || '' }}
        run: |
          IMG=jellyfin/jellyfin:${{ matrix.jellyfin }}
          docker pull -q "$IMG"
          # un fichier vidéo minuscule, copié pour chaque film et chaque épisode
          docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg -v "$PWD/media:/m" "$IMG" -loglevel error \
            -f lavfi -i testsrc=duration=2:size=320x240:rate=10 -f lavfi -i anullsrc -shortest -c:v libx264 -c:a aac /m/sample.mkv
          python tests/integration/sim.py layout media media/sample.mkv
          rm media/sample.mkv

      - name: Start Jellyfin (and Seerr)
        run: |
          docker network create eco
          docker run -d --name jf --network eco -p 8096:8096 -v "$PWD/jf/config:/config" -v "$PWD/jf/cache:/cache" -v "$PWD/media:/media:ro" \
            jellyfin/jellyfin:${{ matrix.jellyfin }}
          if [ "${{ matrix.plugins }}" = eco ] || [ "${{ matrix.plugins }}" = bench ]; then
            mkdir -p seerr && chmod 777 seerr
            docker run -d --name seerr --network eco -p 5055:5055 -e TZ=UTC -v "$PWD/seerr:/app/config" seerr/seerr:latest
          fi

      - name: Browser (Playwright)
        if: matrix.plugins == 'hss' || matrix.plugins == 'full' || matrix.plugins == 'eco'
        run: pip install -q playwright==1.49.1 && python -m playwright install --with-deps chromium >/dev/null

      - name: Simulate and check
        env:
          SIM_BROWSER: ${{ (matrix.plugins == 'hss' || matrix.plugins == 'full' || matrix.plugins == 'eco') && '1' || '' }}
          SIM_EXPECT: ${{ matrix.plugins == 'hss' && 'hss' || matrix.plugins == 'full' && 'hss,je,pr' || (matrix.plugins == 'eco' || matrix.plugins == 'bench') && 'hss,je,pr,seerr' || '' }}
          SIM_BENCH: ${{ matrix.plugins == 'bench' && '1' || '' }}
          SIM_BOLDNESS: ${{ github.event_name == 'push' && matrix.plugins == 'eco' && '1' || '' }}   # branches sim-* : audace prudente / aventureuse
        run: cd tests/integration && python sim.py run

      - name: Server log (Reco+ and errors only)
        if: always()
        run: |
          mkdir -p "$SIM_OUT"
          docker logs jf 2>&1 | grep -E 'Reco\+|RecoPlus|\[ERR\]|\[FTL\]|Exception' \
            | sed -E 's/((api_?key|token|password|pw)[=:" ]+)[^ ,"&]+/\1***/Ig' > "$SIM_OUT/jellyfin.log" || true
          tail -60 "$SIM_OUT/jellyfin.log"
          if docker inspect seerr >/dev/null 2>&1; then
            docker logs seerr 2>&1 | grep -iE 'error|warn|jellyfin|request' \
              | sed -E 's/((api_?key|token|password|pw)[=:" ]+)[^ ,"&]+/\1***/Ig' | tail -200 > "$SIM_OUT/seerr.log" || true
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.jellyfin }}-${{ matrix.plugins }}
          path: sim-out/
          retention-days: 14
