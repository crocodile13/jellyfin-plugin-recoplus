name: Integration

# Reco+ in a real Jellyfin (Docker), with and without the plugins it works with, on the oldest and newest supported
# versions: synthetic library (real titles, dummy files, TMDb metadata through Jellyfin), simulated accounts, full
# computation, then every hook and what each account is offered (report in the job summary and as an artifact).
# Nothing secret: random admin password per run, token masked, fictitious accounts only.
on:
  push:
    branches: ['sim-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jellyfin:
    name: Jellyfin ${{ matrix.jellyfin }} — ${{ matrix.plugins }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.2', '12.4']
        plugins: ['reco', 'hss', 'full']
    env:
      SIM_OUT: ${{ github.workspace }}/sim-out
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build Reco+
        run: ./build.sh

      - name: Plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          P=jf/config/plugins
          mkdir -p "$P" jf/cache media
          cp -r out/RecoPlus_* "$P/"
          JV="${{ matrix.jellyfin }}.0"
          get() {   # dépôt, motif du fichier, dossier
            mkdir -p "$P/$3" dl
            gh release download -R "$1" -p "$2" -D dl --clobber
            unzip -q -o "dl/$2" -d "$P/$3"
          }
          if [ "${{ matrix.plugins }}" != reco ]; then
            get IAmParadox27/jellyfin-plugin-file-transformation "Release-$JV.zip" FileTransformation
            get IAmParadox27/jellyfin-plugin-pages "Release-$JV.zip" PluginPages
            get IAmParadox27/jellyfin-plugin-home-sections "Release-$JV.zip" HomeScreenSections
          fi
          if [ "${{ matrix.plugins }}" = full ]; then
            get n00bcodr/Jellyfin-Enhanced "Jellyfin.Plugin.JellyfinEnhanced_12.0.0.zip" JellyfinEnhanced
            V=$(gh release view -R jellyfin/jellyfin-plugin-playbackreporting --json assets -q '.assets[].name' | grep -E '^playback-reporting_.*\.zip$' | head -1)
            get jellyfin/jellyfin-plugin-playbackreporting "$V" PlaybackReporting
          fi
          ls "$P"

      - name: Library
        run: |
          IMG=jellyfin/jellyfin:${{ matrix.jellyfin }}
          docker pull -q "$IMG"
          # un fichier vidéo minuscule, copié pour chaque film et chaque épisode
          docker run --rm --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg -v "$PWD/media:/m" "$IMG" -loglevel error \
            -f lavfi -i testsrc=duration=2:size=320x240:rate=10 -f lavfi -i anullsrc -shortest -c:v libx264 -c:a aac /m/sample.mkv
          python tests/integration/sim.py layout media media/sample.mkv
          rm media/sample.mkv

      - name: Start Jellyfin
        run: |
          docker run -d --name jf -p 8096:8096 -v "$PWD/jf/config:/config" -v "$PWD/jf/cache:/cache" -v "$PWD/media:/media:ro" \
            jellyfin/jellyfin:${{ matrix.jellyfin }}

      - name: Simulate and check
        env:
          SIM_EXPECT: ${{ matrix.plugins == 'hss' && 'hss' || matrix.plugins == 'full' && 'hss,je,pr' || '' }}
        run: cd tests/integration && python sim.py run

      - name: Server log (Reco+ and errors only)
        if: always()
        run: |
          mkdir -p "$SIM_OUT"
          docker logs jf 2>&1 | grep -E 'Reco\+|RecoPlus|\[ERR\]|\[FTL\]|Exception' \
            | sed -E 's/((api_?key|token|password|pw)[=:" ]+)[^ ,"&]+/\1***/Ig' > "$SIM_OUT/jellyfin.log" || true
          tail -60 "$SIM_OUT/jellyfin.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-${{ matrix.jellyfin }}-${{ matrix.plugins }}
          path: sim-out/
          retention-days: 14
